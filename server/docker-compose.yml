name: clickrush

services:
  postgres:
    # Pinned to a patch version so every machine and environment runs the same
    # server. Bump deliberately, not implicitly.
    image: postgres:18.4-alpine
    container_name: clickrush-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clickrush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clickrush}
      POSTGRES_DB: ${POSTGRES_DB:-clickrush}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clickrush} -d ${POSTGRES_DB:-clickrush}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
